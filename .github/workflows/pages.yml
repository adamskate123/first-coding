# Publishes the game to GitHub Pages. There is no build step -- the repository
# is already a static site -- so this uploads it as-is.
#
# `enablement: true` lets the workflow create the Pages site itself the first
# time it runs, so there is no manual Settings step to remember and the setup
# is reproducible from the repository alone. It needs the `pages: write`
# permission granted below.
#
# GitHub Pages is only available on private repositories with a paid plan, so
# on the free tier the repository has to be public for this to work at all.
name: Deploy to Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: '.'
      - id: deployment
        uses: actions/deploy-pages@v4
